# The clock. Only commits touching state.yaml produce Freight.
# Pushes arrive through the GitHub webhook receiver (see projectconfig.yaml);
# the slow poll below is only a backstop for missed webhook deliveries.
apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  name: sieve-state
  namespace: sieve
spec:
  shard: kargo-test
  interval: 15m
  subscriptions:
  - git:
      repoURL: https://github.com/martysohio/kargo-computer.git
      branch: main
      commitSelectionStrategy: NewestFromBranch
      includePaths:
      - state.yaml
      discoveryLimit: 5
